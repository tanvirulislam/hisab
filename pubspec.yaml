name: hisab
description: "Hisab — offline-first personal & family expense manager."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  drift: ^2.35.4
