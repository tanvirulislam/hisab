name: hisab
description: "Hisab — offline-first personal & family expense manager."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  go_router: ^18.1.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  drift_dev: ^2.35.3
  freezed: ^4.0.3

flutter:
  generate: true
  uses-material-design: true
